services:
  api:
    build:
      context: .
      args:
        # "fallback" (Camelot + Tabula), "ml,fallback" (adds TATR), or "" (base only)
        EXTRAS: ${TEP_EXTRAS:-fallback}
    image: table-extraction-pro:${TEP_EXTRAS_TAG:-fallback}
    ports:
      - "${TEP_PORT:-8000}:8000"
    environment:
      TEP_MAX_UPLOAD_MB: ${TEP_MAX_UPLOAD_MB:-20}
      TEP_MAX_BATCH_FILES: ${TEP_MAX_BATCH_FILES:-10}
      TEP_DEFAULT_ENGINE: ${TEP_DEFAULT_ENGINE:-auto}
      TEP_CORS_ORIGINS: ${TEP_CORS_ORIGINS:-}
      # Async jobs live in this one process (and its tmpfs /tmp): keep a single replica.
      TEP_JOB_WORKERS: ${TEP_JOB_WORKERS:-1}
      TEP_JOB_MAX_QUEUED: ${TEP_JOB_MAX_QUEUED:-16}
      TEP_JOB_TTL_SECONDS: ${TEP_JOB_TTL_SECONDS:-3600}
    volumes:
      # TATR weights are downloaded on first use; keep them across restarts.
      - hf-cache:/home/app/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  hf-cache:
